<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANORA Owner OS | Premium</title>

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css" />

    <!-- Premium Fonts & Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="brand">ANORA<span>OWNER OS</span></div>

        <div class="nav-label">Overview</div>

            Dashboard
        </a>

        <div class="nav-label">Operations</div>
        <a href="#" class="nav-item" onclick="navigate('inventory', this)">
            <svg viewBox="0 0 24 24" fill="none"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" stroke="currentColor" stroke-width="2" /><polyline points="3.27 6.96 12 12.01 20.73 6.96" stroke="currentColor" stroke-width="2" /><line x1="12" y1="22.08" x2="12" y2="12" stroke="currentColor" stroke-width="2" /></svg>

        <a href="#" class="nav-item" onclick="navigate('settings', this)">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2" /></svg>

    <!-- ===== MAIN APP ===== -->
    <div class="main">
        <!-- Header -->
        <div class="header">
            <div class="search-bar">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" /><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" /></svg>
                <input type="text" id="global-search" placeholder="Search orders, staff, inventory..." />
            </div>
            <div class="header-profile">
                <div class="date-display">Tuesday, 18 August 2026</div>
                <div class="avatar">K</div>
                <div>
                    <div style="font-size:10px; color:var(--text-muted); font-weight:700; letter-spacing:1px;">OWNER</div>
                    <div style="font-size:13px; font-weight:600;">Krishna Bhardwaj</div>
                </div>
            </div>
        </div>

        <!-- Dynamic Content -->
        <div class="content" id="view-container"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
